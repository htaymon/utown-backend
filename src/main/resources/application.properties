spring.application.name=utown-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only validates that entities match the migrated schema; it never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger UI "try it out" target. Defaults to local; set APP_OPENAPI_SERVER_URL
# in the deployment environment (e.g. Railway) to point Swagger at that host instead.
app.openapi.server-url=${APP_OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.utown.utown_backend=INFO
logging.level.org.hibernate.SQL=WARN
