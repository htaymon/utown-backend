# Test profile using an in-memory H2 database.

spring.datasource.url=jdbc:h2:mem:utown_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests use Hibernate schema generation instead of Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-key-not-used-outside-junit-1234567890
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health
